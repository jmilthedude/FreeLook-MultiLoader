plugins {
    id 'java-base'
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

// Assemble the universal JAR from all loaders
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Creates a single JAR that works on Fabric, Forge, and NeoForge'
    dependsOn ':fabric:jar', ':forge:jar', ':neoforge:jar'

    archiveFileName = "${mod_name}-${minecraft_version}-${version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // All shared classes + mc-dependent classes from Forge JAR
    from(zipTree(project(':forge').tasks.jar.archiveFile)) {
        include 'net/ninjadev/freelook/**'
        exclude 'net/ninjadev/freelook/FreeLookFabric.class'
        exclude 'net/ninjadev/freelook/FreeLookClient.class'
        exclude 'net/ninjadev/freelook/FreeLookNeoforge.class'
        exclude 'net/ninjadev/freelook/platform/FabricPlatformHelper.class'
        exclude 'net/ninjadev/freelook/platform/NeoForgePlatformHelper.class'
        include 'assets/**'
        include 'pack.mcmeta'
    }

    // Fabric entry points + platform helper
    from(zipTree(project(':fabric').tasks.jar.archiveFile)) {
        include 'net/ninjadev/freelook/FreeLookFabric.class'
        include 'net/ninjadev/freelook/FreeLookClient.class'
        include 'net/ninjadev/freelook/platform/FabricPlatformHelper.class'
    }

    // NeoForge entry point + platform helper + event handler
    from(zipTree(project(':neoforge').tasks.jar.archiveFile)) {
        include 'net/ninjadev/freelook/FreeLookNeoforge.class'
        include 'net/ninjadev/freelook/ClientEvents.class'
        include 'net/ninjadev/freelook/platform/NeoForgePlatformHelper.class'
    }

    // Universal resource files (mixin config, loader metadata, ServiceLoader)
    def expandProps = ['version'                      : version,
                       'group'                        : project.group,
                       'minecraft_version'            : minecraft_version,
                       'minecraft_version_range'      : minecraft_version_range,
                       'fabric_version'               : fabric_version,
                       'fabric_loader_version'        : fabric_loader_version,
                       'mod_name'                     : mod_name,
                       'mod_author'                   : mod_author,
                       'mod_id'                       : mod_id,
                       'license'                      : license,
                       'description'                  : project.findProperty('description') ?: '',
                       'neoforge_version'             : neoforge_version,
                       'neoforge_loader_version_range': neoforge_loader_version_range,
                       'forge_version'                : forge_version,
                       'forge_loader_version_range'   : forge_loader_version_range,
                       'credits'                      : credits,
                       'java_version'                 : java_version]
    from('universal') {
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand expandProps
        }
    }

    manifest {
        attributes([
            'MixinConfigs': 'freelook.mixins.json'
        ])
    }
}
